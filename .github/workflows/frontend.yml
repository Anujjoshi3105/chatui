name: Frontend quality
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run analyze && npm run analyze:lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-measurements
          path: |
            artifacts/
            test-results/
